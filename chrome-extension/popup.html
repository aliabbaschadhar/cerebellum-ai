<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Cerebellum AI</title>
  <style>
    :root {
      --bg: #0c0c0f;
      --card: #16161a;
      --border: rgba(255, 255, 255, 0.1);
      --text: #e0e0e0;
      --primary: #10b981;
      --primary-hover: #059669;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Inter", Roboto, Helvetica, Arial, sans-serif;
      width: 280px;
      padding: 0;
      margin: 0;
      background-color: var(--bg);
      color: var(--text);
    }
    .header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--card);
    }
    .header svg {
      color: var(--primary);
    }
    .header h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }
    .content {
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    p.desc {
      margin: 0;
      font-size: 13px;
      color: rgba(255,255,255,0.6);
      line-height: 1.4;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: var(--primary);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.2s;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2);
    }
    button:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }
    button:active {
      transform: translateY(1px);
    }
    #status {
      font-size: 13px;
      text-align: center;
      min-height: 16px;
      font-weight: 500;
      opacity: 0;
      transition: opacity 0.3s;
    }
    #status.show {
      opacity: 1;
    }
    .success { color: #10b981; }
    .error { color: #ef4444; }
  </style>
</head>
<body>
  <div class="header">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2a4 4 0 0 1 4 4v2h2.5A2.5 2.5 0 0 1 21 10.5v8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 18.5v-8A2.5 2.5 0 0 1 5.5 8H8V6a4 4 0 0 1 4-4z"></path>
      <circle cx="12" cy="14" r="2"></circle>
      <path d="M12 16v2"></path>
    </svg>
    <h2>Cerebellum AI</h2>
  </div>
  <div class="content">
    <p class="desc">Save the current page or post directly to your knowledge base.</p>
    <button id="save-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
        <polyline points="17 21 17 13 7 13 7 21"></polyline>
        <polyline points="7 3 7 8 15 8"></polyline>
      </svg>
      Save to Cerebellum
    </button>
    <div id="status"></div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
